name: Build INVERSO BASS DRIVE Windows VST3
# Runs only when started by hand (Actions > Run workflow), to save build minutes.
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout INVERSO repository
        uses: actions/checkout@v4
      - name: Checkout JUCE 8
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.16-security
          path: JUCE
      - name: Install Inno Setup if necessary
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --yes --no-progress }
      - name: Build VST3 and installer and run DSP tests
        shell: pwsh
        run: |
          .\BassDrive\BUILD_BASS_DRIVE.ps1 -JucePath "${{ github.workspace }}\JUCE"
      - name: Create portable VST3 distribution and file checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'BassDrive'
          $bundle = Join-Path $root 'build\InversoBassDrive_artefacts\Release\VST3\INVERSO BASS DRIVE.vst3'
          $portable = Join-Path $root 'dist\INVERSO_BASS_DRIVE_PORTABLE_VST3_0.4.0'
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item -LiteralPath $bundle -Destination $portable -Recurse -Force
          $instructions = @'
          INVERSO BASS DRIVE v0.4.0  |  Windows x64  |  Cubase VST3
          PORTABLE INSTALL (no EXE required)
          1. Close Cubase.
          2. Extract this GitHub artifact ZIP.
          3. Copy the entire folder INVERSO BASS DRIVE.vst3 into:
             C:\Program Files\Common Files\VST3
          4. Reopen Cubase. If necessary, rescan your VST3 plugins.
          Do not rename the .vst3 folder, or move only its internal binary.
          This package is NOT digitally signed. Checksums verify file integrity, not malware safety.
          '@
          [IO.File]::WriteAllText((Join-Path $portable 'INSTALL.txt'),$instructions,[Text.Encoding]::UTF8)
          $hashes = Get-ChildItem -LiteralPath $portable -Recurse -File |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            Sort-Object FullName |
            ForEach-Object {
              $rel = $_.FullName.Substring($portable.Length+1).Replace('\','/')
              "$((Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant())  $rel"
            }
          $hashes | Set-Content -LiteralPath (Join-Path $portable 'SHA256SUMS.txt') -Encoding ascii
          if (-not (Get-ChildItem -LiteralPath $portable -Recurse -File | Where-Object Extension -eq '.vst3')) { throw 'Portable bundle missing VST3 binary' }
      - name: Publish installer ZIP
        uses: actions/upload-artifact@v4
        with:
          name: INVERSO_BASS_DRIVE_Setup_0.4.0_x64
          path: BassDrive/dist/INVERSO_BASS_DRIVE_Setup_0.4.0_x64.exe
          if-no-files-found: error
      - name: Publish portable VST3 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: INVERSO_BASS_DRIVE_PORTABLE_VST3_0.4.0_NO_EXE
          path: BassDrive/dist/INVERSO_BASS_DRIVE_PORTABLE_VST3_0.4.0/
          if-no-files-found: error
      - name: Publish raw VST3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: INVERSO_BASS_DRIVE_VST3_x64
          path: BassDrive/build/InversoBassDrive_artefacts/Release/VST3/INVERSO BASS DRIVE.vst3/**
          if-no-files-found: error
