name: Build INVERSO ABISMO Windows VST3
on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'Abismo/**'
      - '.github/workflows/abismo-windows.yml'
jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: write # publishes the GitHub Release with direct download links
    steps:
      - name: Checkout INVERSO repository
        uses: actions/checkout@v4
      - name: Checkout JUCE 8
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.16-security
          path: JUCE
      - name: Install Inno Setup if necessary
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --yes --no-progress }
      - name: Build VST3 and installer and run DSP tests
        shell: pwsh
        run: |
          .\Abismo\BUILD_ABISMO.ps1 -JucePath "${{ github.workspace }}\JUCE"
      - name: Create portable VST3 distribution and file checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'Abismo'
          $bundle = Join-Path $root 'build\InversoAbismo_artefacts\Release\VST3\INVERSO ABISMO.vst3'
          $portable = Join-Path $root 'dist\INVERSO_ABISMO_PORTABLE_VST3_0.7.0'
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item -LiteralPath $bundle -Destination $portable -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $root 'build\InversoAbismoSampler_artefacts\Release\VST3\INVERSO ABISMO SAMPLER.vst3') -Destination $portable -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $root 'build\InversoAbismoDrums_artefacts\Release\VST3\INVERSO ABISMO DRUMS.vst3') -Destination $portable -Recurse -Force
          $instructions = @'
          INVERSO ABISMO v0.7.0  |  Windows x64  |  VST3 instrument (Cubase, Studio One, Ableton Live, Reaper)
          PORTABLE INSTALL (no EXE required)
          1. Close your DAW.
          2. Extract this GitHub artifact ZIP.
          3. Copy all three folders (INVERSO ABISMO.vst3, INVERSO ABISMO SAMPLER.vst3, INVERSO ABISMO DRUMS.vst3) into:
             C:\Program Files\Common Files\VST3
          4. Reopen the DAW and rescan VST3 plugins if it does not appear (Instruments / Synth).
          Do not rename the .vst3 folder, or move only its internal binary.
          This package is NOT digitally signed. Checksums verify file integrity, not malware safety.
          '@
          [IO.File]::WriteAllText((Join-Path $portable 'INSTALL.txt'),$instructions,[Text.Encoding]::UTF8)
          $hashes = Get-ChildItem -LiteralPath $portable -Recurse -File |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            Sort-Object FullName |
            ForEach-Object {
              $rel = $_.FullName.Substring($portable.Length+1).Replace('\','/')
              "$((Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant())  $rel"
            }
          $hashes | Set-Content -LiteralPath (Join-Path $portable 'SHA256SUMS.txt') -Encoding ascii
          if (-not (Get-ChildItem -LiteralPath $portable -Recurse -File | Where-Object Extension -eq '.vst3')) { throw 'Portable bundle missing VST3 binary' }
      - name: Publish installer ZIP
        uses: actions/upload-artifact@v4
        with:
          name: INVERSO_ABISMO_Setup_0.7.0_x64
          path: Abismo/dist/INVERSO_ABISMO_Setup_0.7.0_x64.exe
          if-no-files-found: error
      - name: Publish portable VST3 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: INVERSO_ABISMO_PORTABLE_VST3_0.7.0_NO_EXE
          path: Abismo/dist/INVERSO_ABISMO_PORTABLE_VST3_0.7.0/
          if-no-files-found: error
      - name: Publish raw VST3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: INVERSO_ABISMO_VST3_x64
          path: Abismo/build/InversoAbismo_artefacts/Release/VST3/INVERSO ABISMO.vst3/**
          if-no-files-found: error
      - name: Publish raw ABISMO SAMPLER VST3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: INVERSO_ABISMO_SAMPLER_VST3_x64
          path: Abismo/build/InversoAbismoSampler_artefacts/Release/VST3/INVERSO ABISMO SAMPLER.vst3/**
          if-no-files-found: error
      - name: Publish raw ABISMO DRUMS VST3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: INVERSO_ABISMO_DRUMS_VST3_x64
          path: Abismo/build/InversoAbismoDrums_artefacts/Release/VST3/INVERSO ABISMO DRUMS.vst3/**
          if-no-files-found: error
      - name: Publish GitHub Release (direct, permanent download links)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'abismo-v0.7.0'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'Abismo\dist'
          $portableZip = Join-Path $dist 'INVERSO_ABISMO_PORTABLE_VST3_0.7.0.zip'
          Compress-Archive -Path (Join-Path $dist 'INVERSO_ABISMO_PORTABLE_VST3_0.7.0\*') -DestinationPath $portableZip -Force
          $notes = Join-Path $env:RUNNER_TEMP 'notes.md'
          @'
          INVERSO ABISMO 0.7.0: ABISMO (sintetizador), ABISMO SAMPLER e ABISMO DRUMS, VST3 para Windows x64.

          - **INVERSO_ABISMO_Setup_0.7.0_x64.exe**: instala os três. Feche a DAW antes. Não é assinado digitalmente: se o Windows avisar, clique em "Mais informações" e "Executar assim mesmo".
          - **INVERSO_ABISMO_PORTABLE_VST3_0.7.0.zip**: os três plugins sem instalador; copie as pastas .vst3 para C:\Program Files\Common Files\VST3.
          - **ABISMO_DRUMS_WAV_0.7.0.zip**: as 454 gravações do ABISMO DRUMS em WAV (CC0), para usar em qualquer sampler.
          '@ | Set-Content -LiteralPath $notes -Encoding utf8
          # The WAV workflow may create the release first; either way it ends up existing once.
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title 'INVERSO ABISMO 0.7.0' --notes-file $notes --latest
            if ($LASTEXITCODE -ne 0) { gh release view $tag | Out-Null; if ($LASTEXITCODE -ne 0) { throw 'release create failed' } }
          }
          gh release edit $tag --notes-file $notes --title 'INVERSO ABISMO 0.7.0' --latest
          if ($LASTEXITCODE -ne 0) { throw 'release edit failed' }
          gh release upload $tag (Join-Path $dist 'INVERSO_ABISMO_Setup_0.7.0_x64.exe') $portableZip --clobber
          if ($LASTEXITCODE -ne 0) { throw 'release upload failed' }
