name: Build INVERSO ABISMO Windows VST3
# Runs only when asked for, to save build minutes: by hand, or by pushing a
# tag named build-abismo-* (Claude does this when a build is requested).
on:
  workflow_dispatch:
  push:
    tags: ['build-abismo-*']
jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: write # publishes the GitHub Release with direct download links
    steps:
      - name: Checkout INVERSO repository
        uses: actions/checkout@v4
      - name: Checkout JUCE 8
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.16-security
          path: JUCE
      - name: Install Inno Setup if necessary
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --yes --no-progress }
      - name: Build VST3 and installer, run DSP tests and the VST3 conformance of every plugin
        shell: pwsh
        run: |
          .\Abismo\BUILD_ABISMO.ps1 -JucePath "${{ github.workspace }}\JUCE" -NoLto
      - name: Validate every plugin with pluginval (a release is only published if all pass)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'Abismo'
          $tools = Join-Path $env:RUNNER_TEMP 'pluginval'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip' -OutFile (Join-Path $tools 'pluginval.zip')
          Expand-Archive -Path (Join-Path $tools 'pluginval.zip') -DestinationPath $tools -Force
          $pv = Get-ChildItem -LiteralPath $tools -Recurse -Filter 'pluginval.exe' | Select-Object -First 1
          if (-not $pv) { throw 'pluginval.exe not found' }
          $logs = Join-Path $root 'dist\pluginval'
          New-Item -ItemType Directory -Force -Path $logs | Out-Null
          $plugins = @(
            'InversoAbismo\INVERSO ABISMO', 'InversoAbismoSampler\INVERSO ABISMO SAMPLER', 'InversoAbismoDrums\INVERSO ABISMO DRUMS',
            'InversoRelicario\INVERSO RELICARIO', 'InversoEnki\INVERSO ENKI', 'InversoClear\INVERSO CLEAR', 'InversoTide\INVERSO TIDE',
            'InversoNeon\INVERSO NEON', 'InversoHalo\INVERSO HALO',
            'InversoMaster\INVERSO MASTER', 'InversoKick\INVERSO KICK', 'InversoSnare\INVERSO SNARE', 'InversoToms\INVERSO TOMS', 'InversoHats\INVERSO HATS', 'InversoCymbals\INVERSO CYMBALS', 'InversoOverheads\INVERSO OVERHEADS')
          $failed = @()
          foreach ($p in $plugins) {
            $target, $name = $p -split '\\', 2
            $bundle = Join-Path $root "build\$($target)_artefacts\Release\VST3\$name.vst3"
            Write-Host "=== pluginval: $name"
            # pluginval is a GUI program on Windows: start it and wait for its exit code. Three fixed
            # seeds: three different random draws, and the same three on every run
            $exit = 0
            foreach ($seed in @('1', '20261024', '987654321')) {
              $log = Join-Path $logs "$name seed $seed.txt"
              $proc = Start-Process -FilePath $pv.FullName -Wait -PassThru -NoNewWindow -RedirectStandardOutput $log `
                -ArgumentList @('--strictness-level', '10', '--validate-in-process', '--timeout-ms', '900000', '--random-seed', $seed, "`"$bundle`"")
              # the failures in full (pluginval marks them with !!!), then the summary
              Select-String -LiteralPath $log -Pattern '!!!|\*\*\* FAILED|Exception|Error' -Context 6,4 | ForEach-Object { Write-Host $_.ToString() }
              Get-Content -LiteralPath $log | Select-Object -Last 3 | ForEach-Object { Write-Host "  [seed $seed] $_" }
              if ($proc.ExitCode -ne 0) { $exit = $proc.ExitCode }
            }
            if ($exit -ne 0) { $failed += $name; Write-Host "FAILED: $name (exit $exit)" } else { Write-Host "passed: $name (3 seeds)" }
          }
          if ($failed.Count -gt 0) { throw "pluginval failed for: $($failed -join ', ')" }
      - name: Keep the pluginval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-reports
          path: Abismo/dist/pluginval/
          if-no-files-found: ignore
      - name: Create portable VST3 distribution and file checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'Abismo'
          $bundle = Join-Path $root 'build\InversoAbismo_artefacts\Release\VST3\INVERSO ABISMO.vst3'
          $portable = Join-Path $root 'dist\INVERSO_ABISMO_PORTABLE_VST3_0.18.2'
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item -LiteralPath $bundle -Destination $portable -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $root 'build\InversoAbismoSampler_artefacts\Release\VST3\INVERSO ABISMO SAMPLER.vst3') -Destination $portable -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $root 'build\InversoAbismoDrums_artefacts\Release\VST3\INVERSO ABISMO DRUMS.vst3') -Destination $portable -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $root 'build\InversoRelicario_artefacts\Release\VST3\INVERSO RELICARIO.vst3') -Destination $portable -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $root 'build\InversoEnki_artefacts\Release\VST3\INVERSO ENKI.vst3') -Destination $portable -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $root 'build\InversoClear_artefacts\Release\VST3\INVERSO CLEAR.vst3') -Destination $portable -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $root 'build\InversoTide_artefacts\Release\VST3\INVERSO TIDE.vst3') -Destination $portable -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $root 'build\InversoNeon_artefacts\Release\VST3\INVERSO NEON.vst3') -Destination $portable -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $root 'build\InversoHalo_artefacts\Release\VST3\INVERSO HALO.vst3') -Destination $portable -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $root 'build\InversoMaster_artefacts\Release\VST3\INVERSO MASTER.vst3') -Destination $portable -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $root 'build\InversoKick_artefacts\Release\VST3\INVERSO KICK.vst3') -Destination $portable -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $root 'build\InversoSnare_artefacts\Release\VST3\INVERSO SNARE.vst3') -Destination $portable -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $root 'build\InversoToms_artefacts\Release\VST3\INVERSO TOMS.vst3') -Destination $portable -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $root 'build\InversoHats_artefacts\Release\VST3\INVERSO HATS.vst3') -Destination $portable -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $root 'build\InversoCymbals_artefacts\Release\VST3\INVERSO CYMBALS.vst3') -Destination $portable -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $root 'build\InversoOverheads_artefacts\Release\VST3\INVERSO OVERHEADS.vst3') -Destination $portable -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'IRs\INVERSO CABS') -Destination $portable -Recurse -Force
          $instructions = @'
          INVERSO ABISMO v0.18.2  |  Windows x64  |  VST3 instruments and effects (Cubase, Studio One, Ableton Live, Reaper)
          PORTABLE INSTALL (no EXE required)
          1. Close your DAW.
          2. Extract this GitHub artifact ZIP.
          3. Copy all sixteen .vst3 folders (INVERSO ABISMO, ABISMO SAMPLER, ABISMO DRUMS, RELICARIO, ENKI, NEON, CLEAR, TIDE, HALO, MASTER, KICK, SNARE, TOMS, HATS, CYMBALS, OVERHEADS) into:
             C:\Program Files\Common Files\VST3
          4. Reopen the DAW and rescan VST3 plugins if it does not appear (Instruments / Synth).
          Do not rename the .vst3 folder, or move only its internal binary.
          The INVERSO CABS folder holds the impulse responses (Guitar and Bass); keep it anywhere, e.g. Documents\INVERSO.
          This package is NOT digitally signed. Checksums verify file integrity, not malware safety.
          '@
          [IO.File]::WriteAllText((Join-Path $portable 'INSTALL.txt'),$instructions,[Text.Encoding]::UTF8)
          $hashes = Get-ChildItem -LiteralPath $portable -Recurse -File |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            Sort-Object FullName |
            ForEach-Object {
              $rel = $_.FullName.Substring($portable.Length+1).Replace('\','/')
              "$((Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant())  $rel"
            }
          $hashes | Set-Content -LiteralPath (Join-Path $portable 'SHA256SUMS.txt') -Encoding ascii
          if (-not (Get-ChildItem -LiteralPath $portable -Recurse -File | Where-Object Extension -eq '.vst3')) { throw 'Portable bundle missing VST3 binary' }
      - name: Publish installer ZIP
        uses: actions/upload-artifact@v4
        with:
          name: INVERSO_ABISMO_Setup_0.18.2_x64
          path: Abismo/dist/INVERSO_ABISMO_Setup_0.18.2_x64.exe
          if-no-files-found: error
      - name: Publish portable VST3 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: INVERSO_ABISMO_PORTABLE_VST3_0.18.2_NO_EXE
          path: Abismo/dist/INVERSO_ABISMO_PORTABLE_VST3_0.18.2/
          if-no-files-found: error
      - name: Publish raw VST3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: INVERSO_ABISMO_VST3_x64
          path: Abismo/build/InversoAbismo_artefacts/Release/VST3/INVERSO ABISMO.vst3/**
          if-no-files-found: error
      - name: Publish raw ABISMO SAMPLER VST3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: INVERSO_ABISMO_SAMPLER_VST3_x64
          path: Abismo/build/InversoAbismoSampler_artefacts/Release/VST3/INVERSO ABISMO SAMPLER.vst3/**
          if-no-files-found: error
      - name: Publish raw ABISMO DRUMS VST3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: INVERSO_ABISMO_DRUMS_VST3_x64
          path: Abismo/build/InversoAbismoDrums_artefacts/Release/VST3/INVERSO ABISMO DRUMS.vst3/**
          if-no-files-found: error
      - name: Publish raw RELICARIO VST3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: INVERSO_RELICARIO_VST3_x64
          path: Abismo/build/InversoRelicario_artefacts/Release/VST3/INVERSO RELICARIO.vst3/**
          if-no-files-found: error
      - name: Publish raw ENKI VST3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: INVERSO_ENKI_VST3_x64
          path: Abismo/build/InversoEnki_artefacts/Release/VST3/INVERSO ENKI.vst3/**
          if-no-files-found: error
      - name: Publish raw CLEAR VST3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: INVERSO_CLEAR_VST3_x64
          path: Abismo/build/InversoClear_artefacts/Release/VST3/INVERSO CLEAR.vst3/**
          if-no-files-found: error
      - name: Publish raw TIDE VST3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: INVERSO_TIDE_VST3_x64
          path: Abismo/build/InversoTide_artefacts/Release/VST3/INVERSO TIDE.vst3/**
          if-no-files-found: error
      - name: Publish GitHub Release (direct, permanent download links)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'abismo-v0.18.2'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'Abismo\dist'
          $portableZip = Join-Path $dist 'INVERSO_ABISMO_PORTABLE_VST3_0.18.2.zip'
          Compress-Archive -Path (Join-Path $dist 'INVERSO_ABISMO_PORTABLE_VST3_0.18.2\*') -DestinationPath $portableZip -Force
          $cabsZip = Join-Path $dist 'INVERSO_CABS_IRs.zip'
          Compress-Archive -Path (Join-Path $env:GITHUB_WORKSPACE 'IRs\INVERSO CABS') -DestinationPath $cabsZip -Force
          $notes = Join-Path $env:RUNNER_TEMP 'notes.md'
          @'
          INVERSO ABISMO 0.18.2: ABISMO, ABISMO SAMPLER, ABISMO DRUMS, RELICÁRIO, ENKI e NEON (instrumentos) e CLEAR, TIDE, HALO, MASTER, KICK, SNARE, TOMS, HATS, CYMBALS e OVERHEADS (efeitos), VST3 para Windows x64, e as IRs do INVERSO CABS.

          Novo na 0.18.2:
          - DRUMS: o painel à direita mostra as últimas notas que o plugin recebeu (IN C1 D#1 ...), com (K) para notas guardadas durante a troca de kit e tocadas depois dela e (P) para cliques nos pads. Serve para descobrir de onde vem uma segunda nota inesperada: se aparecer na lista sem (K) nem (P), o DAW ou o teclado a mandou.

          Da 0.18.1:
          Correções, a partir do seu uso:
          - DRUMS: os volumes dos pads de cada kit foram igualados por medição (loudness K-weighted de um golpe, objeto por objeto e depois pad por pad em cada kit): a diferença entre o pad mais forte e o mais fraco de um kit era de 13 a 27 dB e agora é de 0 a 0,6 dB (7,7 dB só no Valve Radio, num pad). Um teste novo exige isso.
          - Pistas de bateria (KICK, SNARE, TOMS, HATS, CYMBALS, OVERHEADS): os presets agora mexem de verdade (ganhos de EQ, drive, transientes, compressão e tame mais decididos). O make-up automático dos compressores seguia só o threshold e subia o volume mesmo sem comprimir (+3 a +4 dB em todas as bandas); agora acompanha a redução de ganho realmente aplicada.
          - MASTER: quatro controles diretos no topo, MASTER MACROS: GLUE, WARMTH, TONE e LOUDNESS. Somam por cima do preset (0 = como o preset); LOUDNESS empurra o limitador e o teto continua valendo.

          Da 0.18.0:
          - MASTER: cadeia de masterização para deixar como padrão no master da sessão. EQ (filtros, shelves e dois sinos, em estéreo, só centro ou só laterais) > compressor com quatro caráteres (Var-mu estilo Fairchild, VCA, FET, Opto) > compressor de cola > saturação (Tape, Tube, Transformer) > largura estéreo com graves em mono > limitador de true peak com lookahead > dither (16, 20 ou 24 bits). Medidor de loudness (momentâneo, curto prazo e integrado em LUFS, ITU BS.1770) e pico; clique para zerar. 14 presets (Clean Master, Gentle Glue, Abbey Road, Tape Warmth, Pop Loud, Rock Punch, Electronic Wide, Acoustic, Jazz and Orchestral, Dark Tape, Cinematic, Synthwave, Limiter Only, Metering Only). Latência do limitador: 107 amostras a 48 kHz (proporcional em outras taxas), informada ao DAW.
          - KICK, SNARE, TOMS, HATS, CYMBALS e OVERHEADS: um plugin para cada peça da bateria, com os módulos que cada uma pede: gate (com foco de frequência), transientes (ataque e sustain), EQ, tame (controla o brilho áspero só quando passa do limiar), compressor, saturação e, nos pratos e overheads, largura. 6 a 8 presets em cada (Rock, Metal, Pop, Jazz, Electronic, Lo-fi). Sem latência.
          - Testes novos do motor: resposta do EQ contra a fórmula, compensação de volume da saturação, aliasing, curvas e tempos dos compressores, true peak do limitador medido por uma reconstrução independente 8x (com sinais difíceis), loudness contra a referência EBU (-23 LUFS).

          Da 0.17.1 (correções):
          - DRUMS: escolher um kit traz de volta os sons do próprio kit (um sample carregado num pad não fica mais); a troca de kit é suave e não perde notas tocadas durante ela.
          - SAMPLER: no modo granular, LOOP funciona (Off percorre a região, Forward dá a volta no loop, Ping-pong vai e volta); os marcadores na onda têm nome (START, END, LOOP IN, LOOP OUT, POSITION) e uma linha explica o que fazem; com REVERSE a onda aparece invertida, como soa.
          - DRUMS: 10 dos sons agudos (pratos, chocalhos, ripas) viraram objetos experimentais e deteriorados, graves e médios, feitos das próprias gravações reais rebaixadas, cortadas e degradadas (Motor Morto, Gongo Podre, Mola Morta, Engrenagem, Lata Amassada, Porta de Ferro, Pilha Afundada, Prato Derretido, Chimbal Afundado, Cascalho). Só 5 dos 48 sons ficaram acima de 3 kHz (eram 14).
          - RELICÁRIO: a forma de onda "Static" dos loops da fita agora se chama "Static (noise)": é ruído de propósito.
          - Todos os plugins: ao reabrir uma sessão, cada controle volta exatamente onde estava.
          - Telas grandes (4K): a janela cresce até onde a tela permitir (antes parava em 1,5x), abre num tamanho adequado à tela, lembra o tamanho que você escolher e tem um botão SIZE no canto (100 / 150 / 200 / 300 %).
          - RELICÁRIO: o chiado da fita segue só o botão WEAR (a roda de modulação deixada para cima aumentava o chiado); a pressão (aftertouch) volta a zero sem tecla pressionada; a roda e a pressão aparecem no mostrador enquanto o teclado as envia.
          - Cada plugin passa, antes de cada versão, por um teste que o carrega como um DAW: presets, sessões salvas e reabertas, de 44,1 a 192 kHz, blocos de 1 a 2048 amostras, automação, áudio e editor ao mesmo tempo; e pelo pluginval com três sementes fixas.

          Da 0.17.0:
          - NEON: sintetizador leve de synthwave. Dois osciladores analógicos, sub, ruído e camada FM; filtro ladder 24 dB ou 12 dB; unison até 8; arpejador no tempo do DAW; chorus estilo Juno, delay e reverb leve. 40 presets prontos em categorias (Bass, Polysynth, Lead, Pad, Keys, Pluck, Arp, FX).
          - HALO: reverbs dos anos 80, num plugin à parte: Gated (com threshold, hold e release), Plate, Hall e Room; pré-delay e filtros na entrada. 14 presets.
          - RESAMPLE, num módulo próprio do RELICÁRIO, ENKI e SAMPLER, no lugar do bit crush: escolhe-se uma taxa (20000 a 500 Hz) e o som soa como renderizado nessa taxa e trazido de volta, com SATURATION para peso.
          - Cada plugin desta versão passou pelo pluginval (validação de VST3 da Tracktion, rigor máximo) no próprio build; um release só é publicado se todos passarem.

          Da 0.16.0: RELICÁRIO com o ADSR de cada máquina e seus ajustes protegidos; ENKI com as gravações funcionando; SAMPLER com região START/END na onda; DRUMS com volumes iguais; FURNACE removido.

          - **INVERSO_ABISMO_Setup_0.18.2_x64.exe**: instala os dezesseis plugins e as IRs (Documentos\INVERSO\INVERSO CABS, pastas Guitar e Bass). Feche a DAW antes. Não é assinado digitalmente: se o Windows avisar, clique em "Mais informações" e "Executar assim mesmo".
          - **INVERSO_ABISMO_PORTABLE_VST3_0.18.2.zip**: os dezesseis plugins sem instalador (copie as pastas .vst3 para C:\Program Files\Common Files\VST3) e a pasta INVERSO CABS.
          - **INVERSO_CABS_IRs.zip**: só as IRs, pastas Guitar e Bass.
          - **Gravações do DRUMS em WAV** (CC0, para qualquer sampler): https://github.com/SchizoDellamore/INVERSO/releases/download/abismo-v0.7.0/ABISMO_DRUMS_WAV_0.7.0.zip
          '@ | Set-Content -LiteralPath $notes -Encoding utf8
          # The WAV workflow may create the release first; either way it ends up existing once.
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title 'INVERSO ABISMO 0.18.2' --notes-file $notes --latest
            if ($LASTEXITCODE -ne 0) { gh release view $tag | Out-Null; if ($LASTEXITCODE -ne 0) { throw 'release create failed' } }
          }
          gh release edit $tag --notes-file $notes --title 'INVERSO ABISMO 0.18.2' --latest
          if ($LASTEXITCODE -ne 0) { throw 'release edit failed' }
          gh release upload $tag (Join-Path $dist 'INVERSO_ABISMO_Setup_0.18.2_x64.exe') $portableZip $cabsZip --clobber
          if ($LASTEXITCODE -ne 0) { throw 'release upload failed' }
