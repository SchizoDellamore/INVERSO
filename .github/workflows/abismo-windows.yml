name: Build INVERSO ABISMO Windows VST3
# Runs only when asked for, to save build minutes: by hand, or by pushing a
# tag named build-abismo-* (Claude does this when a build is requested).
on:
  workflow_dispatch:
  push:
    tags: ['build-abismo-*']
jobs:
  build:
    runs-on: windows-2025
    permissions:
      contents: write # publishes the GitHub Release with direct download links
    steps:
      - name: Checkout INVERSO repository
        uses: actions/checkout@v4
      - name: Checkout JUCE 8
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.16-security
          path: JUCE
      - name: Install Inno Setup if necessary
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup --yes --no-progress }
      - name: Build VST3 and installer, run DSP tests and the VST3 conformance of every plugin
        shell: pwsh
        run: |
          .\Abismo\BUILD_ABISMO.ps1 -JucePath "${{ github.workspace }}\JUCE" -NoLto
      - name: Validate every plugin with pluginval (a release is only published if all pass)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'Abismo'
          $tools = Join-Path $env:RUNNER_TEMP 'pluginval'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          Invoke-WebRequest -Uri 'https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_Windows.zip' -OutFile (Join-Path $tools 'pluginval.zip')
          Expand-Archive -Path (Join-Path $tools 'pluginval.zip') -DestinationPath $tools -Force
          $pv = Get-ChildItem -LiteralPath $tools -Recurse -Filter 'pluginval.exe' | Select-Object -First 1
          if (-not $pv) { throw 'pluginval.exe not found' }
          $logs = Join-Path $root 'dist\pluginval'
          New-Item -ItemType Directory -Force -Path $logs | Out-Null
          $plugins = @(
            'InversoAbismo\INVERSO ABISMO', 'InversoAbismoSampler\INVERSO ABISMO SAMPLER', 'InversoAbismoDrums\INVERSO ABISMO DRUMS',
            'InversoRelicario\INVERSO RELICARIO', 'InversoEnki\INVERSO ENKI', 'InversoClear\INVERSO CLEAR', 'InversoTide\INVERSO TIDE',
            'InversoNeon\INVERSO NEON', 'InversoHalo\INVERSO HALO')
          $failed = @()
          foreach ($p in $plugins) {
            $target, $name = $p -split '\\', 2
            $bundle = Join-Path $root "build\$($target)_artefacts\Release\VST3\$name.vst3"
            Write-Host "=== pluginval: $name"
            # pluginval is a GUI program on Windows: start it and wait for its exit code. Three fixed
            # seeds: three different random draws, and the same three on every run
            $exit = 0
            foreach ($seed in @('1', '20261024', '987654321')) {
              $log = Join-Path $logs "$name seed $seed.txt"
              $proc = Start-Process -FilePath $pv.FullName -Wait -PassThru -NoNewWindow -RedirectStandardOutput $log `
                -ArgumentList @('--strictness-level', '10', '--validate-in-process', '--timeout-ms', '900000', '--random-seed', $seed, "`"$bundle`"")
              # the failures in full (pluginval marks them with !!!), then the summary
              Select-String -LiteralPath $log -Pattern '!!!|\*\*\* FAILED|Exception|Error' -Context 6,4 | ForEach-Object { Write-Host $_.ToString() }
              Get-Content -LiteralPath $log | Select-Object -Last 3 | ForEach-Object { Write-Host "  [seed $seed] $_" }
              if ($proc.ExitCode -ne 0) { $exit = $proc.ExitCode }
            }
            if ($exit -ne 0) { $failed += $name; Write-Host "FAILED: $name (exit $exit)" } else { Write-Host "passed: $name (3 seeds)" }
          }
          if ($failed.Count -gt 0) { throw "pluginval failed for: $($failed -join ', ')" }
      - name: Keep the pluginval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pluginval-reports
          path: Abismo/dist/pluginval/
          if-no-files-found: ignore
      - name: Create portable VST3 distribution and file checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:GITHUB_WORKSPACE 'Abismo'
          $bundle = Join-Path $root 'build\InversoAbismo_artefacts\Release\VST3\INVERSO ABISMO.vst3'
          $portable = Join-Path $root 'dist\INVERSO_ABISMO_PORTABLE_VST3_0.17.0'
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item -LiteralPath $bundle -Destination $portable -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $root 'build\InversoAbismoSampler_artefacts\Release\VST3\INVERSO ABISMO SAMPLER.vst3') -Destination $portable -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $root 'build\InversoAbismoDrums_artefacts\Release\VST3\INVERSO ABISMO DRUMS.vst3') -Destination $portable -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $root 'build\InversoRelicario_artefacts\Release\VST3\INVERSO RELICARIO.vst3') -Destination $portable -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $root 'build\InversoEnki_artefacts\Release\VST3\INVERSO ENKI.vst3') -Destination $portable -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $root 'build\InversoClear_artefacts\Release\VST3\INVERSO CLEAR.vst3') -Destination $portable -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $root 'build\InversoTide_artefacts\Release\VST3\INVERSO TIDE.vst3') -Destination $portable -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $root 'build\InversoNeon_artefacts\Release\VST3\INVERSO NEON.vst3') -Destination $portable -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $root 'build\InversoHalo_artefacts\Release\VST3\INVERSO HALO.vst3') -Destination $portable -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'IRs\INVERSO CABS') -Destination $portable -Recurse -Force
          $instructions = @'
          INVERSO ABISMO v0.17.0  |  Windows x64  |  VST3 instrument (Cubase, Studio One, Ableton Live, Reaper)
          PORTABLE INSTALL (no EXE required)
          1. Close your DAW.
          2. Extract this GitHub artifact ZIP.
          3. Copy all nine .vst3 folders (INVERSO ABISMO, ABISMO SAMPLER, ABISMO DRUMS, RELICARIO, ENKI, NEON, CLEAR, TIDE, HALO) into:
             C:\Program Files\Common Files\VST3
          4. Reopen the DAW and rescan VST3 plugins if it does not appear (Instruments / Synth).
          Do not rename the .vst3 folder, or move only its internal binary.
          The INVERSO CABS folder holds the impulse responses (Guitar and Bass); keep it anywhere, e.g. Documents\INVERSO.
          This package is NOT digitally signed. Checksums verify file integrity, not malware safety.
          '@
          [IO.File]::WriteAllText((Join-Path $portable 'INSTALL.txt'),$instructions,[Text.Encoding]::UTF8)
          $hashes = Get-ChildItem -LiteralPath $portable -Recurse -File |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            Sort-Object FullName |
            ForEach-Object {
              $rel = $_.FullName.Substring($portable.Length+1).Replace('\','/')
              "$((Get-FileHash -Algorithm SHA256 -LiteralPath $_.FullName).Hash.ToLowerInvariant())  $rel"
            }
          $hashes | Set-Content -LiteralPath (Join-Path $portable 'SHA256SUMS.txt') -Encoding ascii
          if (-not (Get-ChildItem -LiteralPath $portable -Recurse -File | Where-Object Extension -eq '.vst3')) { throw 'Portable bundle missing VST3 binary' }
      - name: Publish installer ZIP
        uses: actions/upload-artifact@v4
        with:
          name: INVERSO_ABISMO_Setup_0.17.0_x64
          path: Abismo/dist/INVERSO_ABISMO_Setup_0.17.0_x64.exe
          if-no-files-found: error
      - name: Publish portable VST3 ZIP
        uses: actions/upload-artifact@v4
        with:
          name: INVERSO_ABISMO_PORTABLE_VST3_0.17.0_NO_EXE
          path: Abismo/dist/INVERSO_ABISMO_PORTABLE_VST3_0.17.0/
          if-no-files-found: error
      - name: Publish raw VST3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: INVERSO_ABISMO_VST3_x64
          path: Abismo/build/InversoAbismo_artefacts/Release/VST3/INVERSO ABISMO.vst3/**
          if-no-files-found: error
      - name: Publish raw ABISMO SAMPLER VST3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: INVERSO_ABISMO_SAMPLER_VST3_x64
          path: Abismo/build/InversoAbismoSampler_artefacts/Release/VST3/INVERSO ABISMO SAMPLER.vst3/**
          if-no-files-found: error
      - name: Publish raw ABISMO DRUMS VST3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: INVERSO_ABISMO_DRUMS_VST3_x64
          path: Abismo/build/InversoAbismoDrums_artefacts/Release/VST3/INVERSO ABISMO DRUMS.vst3/**
          if-no-files-found: error
      - name: Publish raw RELICARIO VST3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: INVERSO_RELICARIO_VST3_x64
          path: Abismo/build/InversoRelicario_artefacts/Release/VST3/INVERSO RELICARIO.vst3/**
          if-no-files-found: error
      - name: Publish raw ENKI VST3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: INVERSO_ENKI_VST3_x64
          path: Abismo/build/InversoEnki_artefacts/Release/VST3/INVERSO ENKI.vst3/**
          if-no-files-found: error
      - name: Publish raw CLEAR VST3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: INVERSO_CLEAR_VST3_x64
          path: Abismo/build/InversoClear_artefacts/Release/VST3/INVERSO CLEAR.vst3/**
          if-no-files-found: error
      - name: Publish raw TIDE VST3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: INVERSO_TIDE_VST3_x64
          path: Abismo/build/InversoTide_artefacts/Release/VST3/INVERSO TIDE.vst3/**
          if-no-files-found: error
      - name: Publish GitHub Release (direct, permanent download links)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'abismo-v0.17.0'
          $dist = Join-Path $env:GITHUB_WORKSPACE 'Abismo\dist'
          $portableZip = Join-Path $dist 'INVERSO_ABISMO_PORTABLE_VST3_0.17.0.zip'
          Compress-Archive -Path (Join-Path $dist 'INVERSO_ABISMO_PORTABLE_VST3_0.17.0\*') -DestinationPath $portableZip -Force
          $cabsZip = Join-Path $dist 'INVERSO_CABS_IRs.zip'
          Compress-Archive -Path (Join-Path $env:GITHUB_WORKSPACE 'IRs\INVERSO CABS') -DestinationPath $cabsZip -Force
          $notes = Join-Path $env:RUNNER_TEMP 'notes.md'
          @'
          INVERSO ABISMO 0.17.0: ABISMO, ABISMO SAMPLER, ABISMO DRUMS, RELICÁRIO, ENKI e NEON (instrumentos) e CLEAR, TIDE e HALO (efeitos), VST3 para Windows x64, e as IRs do INVERSO CABS.

          Novo na 0.17.0:
          - NEON: sintetizador leve de synthwave. Dois osciladores analógicos, sub, ruído e camada FM; filtro ladder 24 dB ou 12 dB; unison até 8; arpejador no tempo do DAW; chorus estilo Juno, delay e reverb leve. 40 presets prontos em categorias (Bass, Polysynth, Lead, Pad, Keys, Pluck, Arp, FX).
          - HALO: reverbs dos anos 80, num plugin à parte: Gated (com threshold, hold e release), Plate, Hall e Room; pré-delay e filtros na entrada. 14 presets.
          - RESAMPLE, num módulo próprio do RELICÁRIO, ENKI e SAMPLER, no lugar do bit crush: escolhe-se uma taxa (20000 a 500 Hz) e o som soa como renderizado nessa taxa e trazido de volta, com SATURATION para peso.
          - Cada plugin desta versão passou pelo pluginval (validação de VST3 da Tracktion, rigor máximo) no próprio build; um release só é publicado se todos passarem.

          Da 0.16.0: RELICÁRIO com o ADSR de cada máquina e seus ajustes protegidos; ENKI com as gravações funcionando; SAMPLER com região START/END na onda; DRUMS com volumes iguais; FURNACE removido.

          - **INVERSO_ABISMO_Setup_0.17.0_x64.exe**: instala os nove plugins e as IRs (Documentos\INVERSO\INVERSO CABS, pastas Guitar e Bass). Feche a DAW antes. Não é assinado digitalmente: se o Windows avisar, clique em "Mais informações" e "Executar assim mesmo".
          - **INVERSO_ABISMO_PORTABLE_VST3_0.17.0.zip**: os nove plugins sem instalador (copie as pastas .vst3 para C:\Program Files\Common Files\VST3) e a pasta INVERSO CABS.
          - **INVERSO_CABS_IRs.zip**: só as IRs, pastas Guitar e Bass.
          - **Gravações do DRUMS em WAV** (CC0, para qualquer sampler): https://github.com/SchizoDellamore/INVERSO/releases/download/abismo-v0.7.0/ABISMO_DRUMS_WAV_0.7.0.zip
          '@ | Set-Content -LiteralPath $notes -Encoding utf8
          # The WAV workflow may create the release first; either way it ends up existing once.
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title 'INVERSO ABISMO 0.17.0' --notes-file $notes --latest
            if ($LASTEXITCODE -ne 0) { gh release view $tag | Out-Null; if ($LASTEXITCODE -ne 0) { throw 'release create failed' } }
          }
          gh release edit $tag --notes-file $notes --title 'INVERSO ABISMO 0.17.0' --latest
          if ($LASTEXITCODE -ne 0) { throw 'release edit failed' }
          gh release upload $tag (Join-Path $dist 'INVERSO_ABISMO_Setup_0.17.0_x64.exe') $portableZip $cabsZip --clobber
          if ($LASTEXITCODE -ne 0) { throw 'release upload failed' }
